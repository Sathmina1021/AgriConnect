<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Administration - AgriConnect</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar">
    <div><strong>AgriConnect - Administration</strong></div>
    <div>
      <a href="index.html">Home</a>
      <a href="farmer.html">Farmer</a>
      <a href="supplier.html">Supplier</a>
      <a href="officer.html">Officer</a>
      <a class="active" href="admin.html">Admin</a>
      <a href="api-docs.html">API</a>
    </div>
  </div>

  <div class="container">
    <div class="box">
      <h2>Microservices Status &amp; Platform Summary</h2>
      <div class="row" id="summaryCards"></div>
    </div>

    <div class="row">
      <div class="col box">
        <h2>Add User Account</h2>
        <form id="userForm">
          <div class="form-row">
            <div><label>Full Name</label><input id="uName" required /></div>
            <div><label>Email</label><input id="uEmail" type="email" required /></div>
          </div>
          <div class="form-row">
            <div><label>Username (optional)</label><input id="uUsername" placeholder="auto-generated if blank" /></div>
            <div><label>Password</label><input id="uPassword" value="changeme123" required /></div>
          </div>
          <div class="form-row">
            <div><label>Role</label><select id="uRole"><option>Farmer</option><option>Supplier</option><option>Officer</option><option>Admin</option></select></div>
            <div><label>District</label><input id="uDist" value="Colombo" required /></div>
          </div>
          <button type="submit" class="btn-blue">Create Account</button>
        </form>
      </div>

      <div class="col box">
        <h2>Platform Users</h2>
        <table>
          <thead><tr><th>Name / Username</th><th>Role</th><th>District</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="userTable"></tbody>
        </table>
      </div>
    </div>

    <div class="box">
      <h2>System Audit Logs</h2>
      <table>
        <thead><tr><th>Time</th><th>Service</th><th>Action</th><th>Details</th></tr></thead>
        <tbody id="logTable"></tbody>
      </table>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function loadAdmin() {
      const [summary, users, logs] = await Promise.all([
        apiFetch(`${SERVICES.admin}/summary`),
        apiFetch(`${SERVICES.admin}/users`),
        apiFetch(`${SERVICES.admin}/logs`)
      ]);

      document.getElementById("summaryCards").innerHTML = `
        <div class="col"><strong>Total Users:</strong> ${summary.totalUsers}</div>
        <div class="col"><strong>Supply Requests:</strong> ${summary.requests}</div>
        <div class="col"><strong>Quotations:</strong> ${summary.quotes}</div>
        <div class="col"><strong>Deliveries:</strong> ${summary.deliveries}</div>
        <div class="col"><strong>Crop Listings:</strong> ${summary.crops}</div>
        <div class="col"><strong>Advisories:</strong> ${summary.advisories}</div>
        <div class="col"><strong>FarmerService:</strong> ${getBadge(summary.services.farmer)}</div>
        <div class="col"><strong>SupplierService:</strong> ${getBadge(summary.services.supplier)}</div>
        <div class="col"><strong>OfficerService:</strong> ${getBadge(summary.services.officer)}</div>
        <div class="col"><strong>AdminService:</strong> ${getBadge(summary.services.admin)}</div>
      `;

      document.getElementById("userTable").innerHTML = users.map(u => `
        <tr>
          <td><strong>${escHtml(u.fullName)}</strong><br><small><code>${escHtml(u.username)}</code> &bull; ${escHtml(u.email)}</small></td>
          <td>${escHtml(u.role)}</td>
          <td>${escHtml(u.district)}</td>
          <td>${u.active ? getBadge("Running") : getBadge("Offline")}</td>
          <td>
            <button class="btn-sm btn-blue" onclick="toggleUser(${u.id})">${u.active ? "Disable" : "Enable"}</button>
            <button class="btn-sm btn-red" onclick="deleteUser(${u.id}, '${escJs(u.username)}')">Delete</button>
          </td>
        </tr>
      `).join("");

      document.getElementById("logTable").innerHTML = logs.map(l => `
        <tr>
          <td>${new Date(l.logTime).toLocaleString()}</td>
          <td>${escHtml(l.serviceName)}</td>
          <td>${escHtml(l.action)}</td>
          <td>${escHtml(l.details)}</td>
        </tr>
      `).join("");
    }

    async function toggleUser(id) {
      try {
        await apiFetch(`${SERVICES.admin}/users/${id}/toggle`, { method: "PUT" });
        loadAdmin();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteUser(id, username) {
      if (!confirm(`Delete user '${username}'?`)) return;
      try {
        await apiFetch(`${SERVICES.admin}/users/${id}`, { method: "DELETE" });
        loadAdmin();
      } catch (err) {
        alert(err.message);
      }
    }

    document.getElementById("userForm").addEventListener("submit", async e => {
      e.preventDefault();
      try {
        const res = await apiFetch(`${SERVICES.admin}/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fullName: document.getElementById("uName").value,
            email: document.getElementById("uEmail").value,
            username: document.getElementById("uUsername").value.trim() || null,
            password: document.getElementById("uPassword").value,
            role: document.getElementById("uRole").value,
            district: document.getElementById("uDist").value,
            active: true
          })
        });
        e.target.reset();
        document.getElementById("uPassword").value = "changeme123";
        alert(`User created!\nUsername: ${res.username}\nPassword: ${res.password}`);
        loadAdmin();
      } catch (err) {
        alert(err.message);
      }
    });

    (async () => {
      const user = await requireRole("Admin");
      if (user) loadAdmin();
    })();
  </script>
</body>
</html>
